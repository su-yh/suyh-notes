# =============================================================
# filebeat-efe-es.yml
# efe 项目日志采集配置 —— Elasticsearch 输出版（生产用）
#
# 解析逻辑与 filebeat-efe.yml（本地 file 输出）完全一致，
# 仅将输出从 output.file 换成 output.elasticsearch。
#
# 对应 logback 格式（efe.xml 中 PATTERN_STDOUT）：
#   %d{yyyy-MM-dd HH:mm:ss.SSS} | %highlight(%5p) | %20.20thread |
#   %boldGreen(%40.40logger:%4L) | %yellow(%X{trace-id}) |
#   %boldBlue(%X{trace-user}) | %m%n
#
# 说明：
#   - 实测 efe.log 中不含 ANSI 颜色码（logback 写文件时已去除颜色），
#     因此按纯文本用 dissect 拆分。
#   - 比 medcase 格式多一个 trace-user 字段，共 7 个字段。
#   - %20.20thread、%40.40logger:%4L 为右对齐填充，需去空格；
#     %5p 级别：INFO/WARN 带前导空格、DEBUG/ERROR 不带，用 script 按空白拆分。
# =============================================================

# ============================== 运行时路径 ==============================
# 独立数据目录（注册表/偏移），与本地 file 版（data-efe）及其它进程隔离，
# 避免共用同一 data/ 导致注册表冲突
path.data: /Users/suyunhong/suyh-develop/medcase/filebeat-7.17.29-darwin-x86_64/data-efe-es
# 本进程独立的运行日志目录
path.logs: /Users/suyunhong/suyh-develop/medcase/filebeat-7.17.29-darwin-x86_64/logs-efe-es

filebeat.inputs:
  - type: log
    id: efe-logs-es
    enabled: true

    # 日志路径：只采集当前正在写入的 efe.log
    # 部署到 Linux 服务器后，请把 paths 改为服务器上的真实绝对路径
    paths:
      - /Users/suyunhong/suyh-develop/medcase/logs/efe.log

    # 首次运行时从文件开头读取（可用于回填历史日志）
    start_position: beginning

    # 多行合并：Spring Boot 启动横幅、Quartz 多行信息等不以时间戳开头的行，
    # 合并到上一条日志事件（实测 log 输入的 multiline 稳定）
    multiline:
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}[.,][0-9]{3}'
      negate: true
      match: after

# ============================ processors ============================
processors:
  # 追加主机元数据（host.name 等）
  - add_host_metadata: ~

  # 标记事件归属（按需可再细分 service 字段）
  - add_fields:
      target: event
      fields:
        module: efe
        dataset: efe

  # 保留原始整行日志，便于后续回溯/比对（必须在解析 message 之前）
  - copy_fields:
      fields:
        - from: message
          to: log.original
      fail_on_error: false

  # 丢弃空行/全空白行产生的空事件
  - drop_event:
      when:
        not:
          regexp:
            message: '\S'

  # ---- 主结构拆分：字段以 “ | ” 分隔（7 个字段）----
  # 样例：2026-10-21 14:59:21.848 |  INFO |                 main |
  #       com.alibaba.druid.pool.DruidDataSource: 975 |  |  | {dataSource-1} inited
  # trace-id / trace-user 未启用时为空串，最后 %{message} 贪婪取到行尾
  # 注意 target_prefix: ""，让字段落在顶层，而不是默认的 dissect.* 命名空间
  - dissect:
      tokenizer: "%{log_timestamp} | %{level_pid} | %{thread} | %{logger_line} | %{trace_id} | %{trace_user} | %{message}"
      target_prefix: ""
      overwrite_keys: true
      ignore_failure: true
      tag_on_failure: ["_dissect_parse_failure"]

  # ---- 拆分 “logger: 行号”：%40.40logger:%4L ----
  # 样例：   com.alibaba.druid.pool.DruidDataSource:  975
  # 注意 %4L 右对齐：行号<1000 为 “: 975”（带空格）、≥1000 为 “:1220”（无空格），
  #       故 tokenizer 冒号后不写死空格，由 script 统一 trim
  - dissect:
      field: logger_line
      tokenizer: "%{logger}:%{line}"
      target_prefix: ""
      overwrite_keys: true
      ignore_failure: true

  # ---- 拆分 “级别+PID” 并清理对齐填充 ----
  # level_pid 样例：" INFO"（带前导填充）或 "DEBUG"（无填充）
  # dissect 无法匹配“可选前导空格”，故用 script 按空白拆分；同时 trim thread/logger/line
  # 注意：efe 格式没有 ${PID} 字段，level_pid 只含级别；为与 medcase 通用，
  #       仍按空白拆取第一个词为级别（pid 无则不产生）
  - script:
      lang: javascript
      source: >
        function process(event) {
          // ① 级别拆分 + ② 字段清理
          var lp = event.Get("level_pid");
          if (typeof lp === "string") {
            var parts = lp.trim().split(/\s+/);
            if (parts.length >= 1) {
              event.Put("log_level", parts[0]);
            }
          }
          var f = ["thread", "logger", "line"];
          for (var i = 0; i < f.length; i++) {
            var v = event.Get(f[i]);
            if (typeof v === "string") event.Put(f[i], v.trim());
          }
          // ③ trace_user 拆分
          var tu = event.Get("trace_user");
          if (typeof tu === "string") {
            var m = tu.match(/^\[([^\]]*)\](.*)$/);
            if (m) {
              event.Put("user_id", m[1]);
              event.Put("trace_user_name", m[2]);
            }
          }
        }

  # ---- 丢弃中间字段 ----
  - drop_fields:
      fields: [level_pid, logger_line]
      ignore_missing: true

  # ---- 数字转整型 ----
  - convert:
      fields:
        - from: line
          to: line
          type: integer
          ignore_missing: true

  # ---- 字段重命名，贴近 ECS 命名 ----
  - rename:
      fields:
        - from: log_level
          to: log.level
        - from: line
          to: log.line
        - from: log_timestamp
          to: log.timestamp
      ignore_missing: true

  # ---- 日志时间解析到 @timestamp ----
  # 等价于 Luxon 的：DateTime.fromFormat(log.timestamp, "yyyy-MM-dd HH:mm:ss.SSS", {zone:"Asia/Shanghai"})
  # filebeat 原生 timestamp 处理器按指定时区正确解析，无需手工换算偏移。
  # 注意：@timestamp 会变为日志时间（这是日志采集的标准语义，Kibana/按天索引均依赖它）。
  - timestamp:
      field: log.timestamp
      target_field: "@timestamp"
      layouts:
        - "2006-01-02 15:04:05.000"
      timezone: "Asia/Shanghai"
      ignore_failure: true

  # ---- 从解析好的 @timestamp 取毫秒 + 按目标时区转日期 yyyyMMdd ----
  # log.timestamp_ms：@timestamp 已按 timezone 正确换算为 UTC 时刻，取毫秒整数
  # log.date：从时间戳按目标时区偏移换算（epoch 毫秒 + 偏移 → UTC 组件即目标时区日期）
  #           goja 无时区库，偏移即“给定时区”的唯一映射；Asia/Shanghai=+8，
  #           若需改为其它时区（如 America/New_York=-5），只需改 timezone 与下方 offsetHours
  - script:
      lang: javascript
      source: >
        function process(event) {
          var ts = event.Get("@timestamp");
          if (ts) {
            var ms = Math.floor(ts.UnixNano() / 1000000);
            event.Put("log.timestamp_ms", ms);
            var offsetHours = 8; // 目标时区：Asia/Shanghai = UTC+8
            var d = new Date(ms + offsetHours * 3600 * 1000);
            event.Put("log.date", d.getUTCFullYear() * 10000 + (d.getUTCMonth() + 1) * 100 + d.getUTCDate());
          }
        }

# ============================ 输出：Elasticsearch ============================
output.elasticsearch:
  # ← 改成你的 ES 地址（多节点可列出多个）
  hosts: ["http://your-elasticsearch-host:9200"]
  # ES 开启安全认证时，取消注释并填写：
  # username: "elastic"
  # password: "your-password"

  # 按日志日期（Asia/Shanghai）分索引，如 efe-log-20261021
  # （log.date 为已按目标时区换算好的 yyyyMMdd 整数，比 %{+yyyy.MM.dd} 更符合上海时区）
  index: "efe-log-%{[log.date]}"

  # bulk 批量写入参数（可按需调整）
  bulk_max_size: 1600
  flush_interval: 5s

# 使用自定义索引名必须关闭 ILM，否则 ILM 会接管索引命名
setup.ilm.enabled: false

# 自定义索引字段映射模板（匹配 efe-log-*，字段类型更规范，建议开启）
# 若暂不需要精确映射或加载失败，可改为 false，由 ES 首次写入自动建映射
setup.template.enabled: true
setup.template.name: efe-log
setup.template.pattern: "efe-log-*"
setup.template.settings.index.number_of_shards: 1
setup.template.settings.index.number_of_replicas: 1
