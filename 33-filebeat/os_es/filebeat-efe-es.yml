# =============================================================
# filebeat-efe-es.yml
# efe 项目日志采集配置 —— Elasticsearch 输出版（生产用）
#
# 解析逻辑与 filebeat-efe.yml（本地 file 输出）完全一致，
# 仅将输出从 output.file 换成 output.elasticsearch。
#
# 对应 logback 格式（efe.xml 中 PATTERN_STDOUT）：
#   %d{yyyy-MM-dd HH:mm:ss.SSS} | %highlight(%5p) | %20.20thread |
#   %boldGreen(%40.40logger:%4L) | %yellow(%X{trace-id}) |
#   %boldBlue(%X{trace-user}) | %m%n
#
# 说明：
#   - 实测 efe.log 中不含 ANSI 颜色码（logback 写文件时已去除颜色），
#     因此按纯文本用 dissect 拆分。
#   - 比 medcase 格式多一个 trace-user 字段，共 7 个字段。
#   - %20.20thread、%40.40logger:%4L 为右对齐填充，需去空格；
#     %5p 级别：INFO/WARN 带前导空格、DEBUG/ERROR 不带，用 script 按空白拆分。
# =============================================================

# ============================== 运行时路径 ==============================
# 独立数据目录（注册表/偏移），与本地 file 版（data-efe）及其它进程隔离，
# 避免共用同一 data/ 导致注册表冲突
path.data: /Users/suyunhong/suyh-develop/github/suyh-notes/33-filebeat/efe/data-es
# 本进程独立的运行日志目录
path.logs: /Users/suyunhong/suyh-develop/github/suyh-notes/33-filebeat/efe/logs/es

filebeat.inputs:
  - type: log
    id: suyh-efe-log-es
    enabled: true

    # 日志路径：只采集当前正在写入的 efe.log
    # 部署到 Linux 服务器后，请把 paths 改为服务器上的真实绝对路径
    paths:
      - /Users/suyunhong/suyh-develop/github/suyh-notes/33-filebeat/logs/efe.log

    # 首次运行时从文件开头读取（可用于回填历史日志）
    start_position: beginning

    # 多行合并：Spring Boot 启动横幅、Quartz 多行信息等不以时间戳开头的行，
    # 合并到上一条日志事件（实测 log 输入的 multiline 稳定）
    multiline:
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}[.,][0-9]{3}'
      negate: true
      match: after

# ============================ processors ============================
processors:
  # 追加主机元数据（host.name 等）
  - add_host_metadata: ~

  # 标记事件归属（按需可再细分 service 字段）
  - add_fields:
      target: event
      fields:
        module: efe
        dataset: efe

  # 保留原始整行日志，便于后续回溯/比对（必须在解析 message 之前）
  - copy_fields:
      fields:
        - from: message
          to: log.original
      fail_on_error: false

  # 丢弃空行/全空白行产生的空事件
  - drop_event:
      when:
        not:
          regexp:
            message: '\S'

  # ---- 主结构拆分：字段以 “ | ” 分隔（7 个字段）----
  # 样例：2026-10-21 14:59:21.848 |  INFO |                 main |
  #       com.alibaba.druid.pool.DruidDataSource: 975 |  |  | {dataSource-1} inited
  # trace-id / trace-user 未启用时为空串，最后 %{message} 贪婪取到行尾
  # 注意 target_prefix: ""，让字段落在顶层，而不是默认的 dissect.* 命名空间
  - dissect:
      tokenizer: "%{log_timestamp} | %{level_pid} | %{log_thread} | %{logger_line} | %{trace_id} | %{log_trace_user} | %{message}"
      target_prefix: ""
      overwrite_keys: true
      ignore_failure: true
      tag_on_failure: ["_dissect_parse_failure"]

  # ---- 拆分 “logger: 行号”：%40.40logger:%4L ----
  # 样例：   com.alibaba.druid.pool.DruidDataSource:  975
  # 注意 %4L 右对齐：行号<1000 为 “: 975”（带空格）、≥1000 为 “:1220”（无空格），
  #       故 tokenizer 冒号后不写死空格，由 script 统一 trim
  - dissect:
      field: logger_line
      tokenizer: "%{log_logger}:%{line}"
      target_prefix: ""
      overwrite_keys: true
      ignore_failure: true

  # ---- 拆分 “级别+PID” 并清理对齐填充 ----
  # level_pid 样例：" INFO"（带前导填充）或 "DEBUG"（无填充）
  # dissect 无法匹配“可选前导空格”，故用 script 按空白拆分；同时 trim log_thread/log_logger/line
  # 注意：efe 格式没有 ${PID} 字段，level_pid 只含级别；为与 medcase 通用，
  #       仍按空白拆取第一个词为级别（pid 无则不产生）
  - script:
      lang: javascript
      source: >
        function process(event) {
          // ① 级别拆分 + ② 字段清理
          var lp = event.Get("level_pid");
          if (typeof lp === "string") {
            var parts = lp.trim().split(/\s+/);
            if (parts.length >= 1) {
              event.Put("log_level", parts[0]);
            }
          }
          // 将数据取出来，去除首尾的空格
          var f = ["log_thread", "log_logger", "line"];
          for (var i = 0; i < f.length; i++) {
            var v = event.Get(f[i]);
            if (typeof v === "string") event.Put(f[i], v.trim());
          }
          // ③ log_trace_user 拆分
          var tu = event.Get("log_trace_user");
          if (typeof tu === "string") {
            var m = tu.match(/^\[([^\]]*)\](.*)$/);
            if (m) {
              event.Put("user_id", m[1]);
            }
          }
        }

  # ---- 丢弃中间字段 ----
  - drop_fields:
      fields: [level_pid, logger_line, message]
      ignore_missing: true

  # ---- 数字转整型 ----
  - convert:
      fields:
        - from: line
          to: line
          type: integer
          ignore_missing: true

  # ---- 字段重命名 ----
  - rename:
      fields:
        - from: log_level
          to: log.level
        - from: line
          to: log.line
        - from: log_thread
          to: log.thread
        - from: log_logger
          to: log.logger
        - from: log_trace_user
          to: log.trace_user
        - from: trace_id
          to: log.trace_id
        - from: user_id
          to: log.user_id
      ignore_missing: true

  # ---- 日志时间解析到 @timestamp ----
  # 等价于 Luxon 的：DateTime.fromFormat(log.timestamp, "yyyy-MM-dd HH:mm:ss.SSS", {zone:"Asia/Shanghai"})
  # filebeat 原生 timestamp 处理器按指定时区正确解析，无需手工换算偏移。
  # 注意：@timestamp 会变为日志时间（这是日志采集的标准语义，Kibana/按天索引均依赖它）。
  - timestamp:
      field: log_timestamp
      target_field: "@timestamp"
      layouts:
        - "2006-01-02 15:04:05.000"
      timezone: "Asia/Shanghai"
      ignore_failure: true

  # ---- 生成 log.timestamp_ms 和 log.date ----
  - script:
      lang: javascript
      source: >
        function process(event) {
          var ts = event.Get("@timestamp");
          if (ts) {
            var ms = Math.floor(ts.UnixNano() / 1000000);
            event.Put("log.timestamp_ms", ms);
            // 目标时区：Asia/Shanghai = UTC+8
            var offsetHours = 8;
            var d = new Date(ms + offsetHours * 3600 * 1000);
            event.Put("log.date", d.getUTCFullYear() * 10000 + (d.getUTCMonth() + 1) * 100 + d.getUTCDate());
          }
          // 删除中间字段 log_timestamp，不写入 ES
          event.Delete("log_timestamp");
        }





# ============================ 输出：Elasticsearch ============================
output.elasticsearch:
  hosts: ["http://qu-yun.isuyh.com:9200"]

  protocol: "http"

  # 按日志日期分索引，使用 ES 模板中定义的 ILM
  index: "suyh-efe-log-%{[log.date]}"

  bulk_max_size: 1600
  flush_interval: 5s

# ============================ 模板配置 ============================
# 禁用 Filebeat 的模板管理，使用 ES 中已创建的模板和 ILM
setup.template.enabled: false
setup.ilm.enabled: false
setup.ecs_compatibility: disabled




